<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Header Ejemplo</title>
  <!-- Google Fonts: Montserrat -->
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="header-ejemplo.css">
  <style>
    /* Solo estilos mínimos si es necesario, el resto está en header-ejemplo.css */
  </style>
</head>
<body>
  <div class="top-header">
    <div class="top-header__left">
      <span>Envío gratis en compras superiores a $150.000</span>
    </div>
    <div class="top-header__right">
      <a href="#" class="top-header__link">Ayuda</a>
      <a href="#" class="top-header__link">Club Crocs</a>
      <a href="#" class="top-header__link">Encuentra tu tienda</a>
    </div>
  </div>
  <header class="header">
    <div class="header__logo">
      <a href="/">
        <img src="https://crocs.com.co/cdn/shop/files/logo_crocs.png?v=1667483006" alt="crocs logo" />
      </a>
    </div>
    <nav class="header__nav">
      <a href="/mujer" class="header__link">MUJER</a>
      <a href="/hombre" class="header__link">HOMBRE</a>
      <a href="/ninos" class="header__link">NIÑOS</a>
      <a href="/jibbitz-charms" class="header__link">JIBBITZ™ CHARMS</a>
      <a href="/crocs-at-work" class="header__link">CROCS AT WORK™</a>
      <a href="/rebajas" class="header__link header__link--rebajas">REBAJAS <img src="https://crocs.com.co/cdn/shop/files/sale_tag.png?v=1670592630" alt="Rebajas" /></a>
    </nav>
    <div class="header__actions">
      <div class="header__searchbox">
        <input type="text" class="header__search" placeholder="Búsqueda" aria-label="Buscar" />
        <span class="header__searchicon">
          <!-- Ícono lupa SVG -->
          <svg viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
      </div>
      <button class="header__iconbtn" title="Favoritos">
        <!-- Ícono corazón SVG -->
        <svg viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6c-1.5-1.4-3.9-1.4-5.4 0l-.7.7-.7-.7c-1.5-1.4-3.9-1.4-5.4 0-1.6 1.5-1.6 4 0 5.5l6.1 6.1 6.1-6.1c1.6-1.5 1.6-4 0-5.5z"/></svg>
      </button>
      <button class="header__iconbtn" title="Carrito">
        <!-- Ícono carrito SVG -->
        <svg viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61l1.38-7.39H6"/></svg>
      </button>
    </div>
  </header>
  <script>
    // Ejemplo: mostrar alerta al buscar
    document.querySelector('.header__search').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        alert('Buscando: ' + this.value);
      }
    });
    // Ejemplo: mostrar alerta al hacer click en carrito
    document.querySelector('.header__iconbtn[title="Carrito"]').addEventListener('click', function() {
      alert('Ir al carrito');
    });
  </script>
</body>
</html>
